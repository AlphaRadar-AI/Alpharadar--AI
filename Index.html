<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AlphaRadar AI</title>

<style>
body {
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    color: #00e5a8;
}

.card {
    background: #171f33;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
}

button {
    background: #00e5a8;
    color: #07111d;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
}

a {
    color: #00e5a8;
}

.small {
    color: #aab3c5;
}
</style>
</head>

<body>

<h1>🚀 AlphaRadar AI</h1>

<p>Discover emerging crypto tokens and Web3 opportunities.</p>

<button onclick="loadTokens()">Scan New Tokens</button>

<h2>New Token Radar</h2>

<div id="tokens">
    <p class="small">Tap Scan New Tokens to begin.</p>
</div>

<script>

async function loadTokens() {

const container = document.getElementById("tokens");

container.innerHTML = "Scanning blockchain data...";

try {

const response = await fetch(
"https://api.dexscreener.com/token-profiles/latest/v1"
);

const data = await response.json();

container.innerHTML = "";

data.slice(0, 20).forEach(token => {

const card = document.createElement("div");

card.className = "card";

const name = document.createElement("h3");
name.textContent = token.chainId.toUpperCase();

const address = document.createElement("p");
address.textContent = "Token: " + token.tokenAddress;

const link = document.createElement("a");
link.href = token.url;
link.target = "_blank";
link.rel = "noopener noreferrer";
link.textContent = "View Token";

card.appendChild(name);
card.appendChild(address);
card.appendChild(link);

container.appendChild(card);

});

} catch(error) {

container.textContent =
"Unable to load tokens. Please check your internet connection and try again.";

}

}

</script>

</body>
</html>
