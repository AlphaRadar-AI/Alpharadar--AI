<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaRadar AI | Multi-Chain Token Scanner</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #080d19;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px 0;
    border-bottom: 1px solid #263149;
}

h1 { color: #00e5a8; }

.subtitle { color: #9ba9c0; }

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
    gap: 12px;
    margin: 25px 0;
}

.card {
    background: #141e31;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #263149;
}

.stat {
    font-size: 23px;
    color: #00e5a8;
    font-weight: bold;
}

label { color: #aab3c5; }

select, button {
    padding: 12px;
    border-radius: 7px;
    border: none;
    margin: 8px 5px 8px 0;
}

select {
    background: #1b2940;
    color: white;
}

button {
    background: #00e5a8;
    color: #06121b;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.token {
    background: #141e31;
    padding: 16px;
    margin: 12px 0;
    border-radius: 12px;
    border-left: 4px solid #00e5a8;
}

.token h3 { margin-bottom: 8px; }

.token p {
    color: #aab3c5;
    overflow-wrap: anywhere;
}

.token a {
    color: #00e5a8;
}

.badge {
    color: #00e5a8;
    font-weight: bold;
}

#status {
    color: #f5c451;
    margin: 15px 0;
}

footer {
    color: #718096;
    margin-top: 35px;
    font-size: 12px;
}

</style>
</head>

<body>

<header>
<h1>🚀 AlphaRadar AI</h1>
<p class="subtitle">Multi-chain crypto discovery and intelligence platform.</p>
</header>

<div class="stats">
<div class="card">
<label>Tokens Found</label>
<div class="stat" id="total">0</div>
</div>

<div class="card">
<label>Chains Supported</label>
<div class="stat">3</div>
</div>

<div class="card">
<label>Scanner Status</label>
<div class="stat" id="scanner">OFF</div>
</div>
</div>

<h2>🔍 Token Launch Radar</h2>

<label for="chain">Select Blockchain:</label>

<select id="chain">
<option value="all">All Blockchains</option>
<option value="solana">Solana</option>
<option value="bsc">BNB Chain</option>
<option value="ethereum">Ethereum</option>
</select>

<br>

<button id="scanButton" onclick="loadTokens()">
SCAN NEW TOKENS
</button>

<div id="status">Ready to scan.</div>

<div id="tokens">
<p class="subtitle">Your discovered tokens will appear here.</p>
</div>

<footer>
<p>AlphaRadar AI © 2026</p>
<p>Market data powered by DexScreener API.</p>
<p>Always conduct independent research before investing.</p>
</footer>

<script>

const supportedChains = ["solana", "bsc", "ethereum"];

async function loadTokens() {

const container = document.getElementById("tokens");
const status = document.getElementById("status");
const button = document.getElementById("scanButton");

const selected = document.getElementById("chain").value;

button.disabled = true;
button.textContent = "SCANNING...";
status.textContent = "Connecting to market data...";
container.innerHTML = "";

try {

const response = await fetch(
"https://api.dexscreener.com/token-profiles/latest/v1"
);

if (!response.ok) {
throw new Error("API request failed");
}

const data = await response.json();

const filtered = data.filter(token =>
supportedChains.includes(token.chainId) &&
(selected === "all" || token.chainId === selected)
);

document.getElementById("total").textContent = filtered.length;
document.getElementById("scanner").textContent = "ACTIVE";

if (filtered.length === 0) {
container.innerHTML = "<p>No matching token profiles found. Try another chain.</p>";
}

filtered.slice(0, 30).forEach(token => {

const card = document.createElement("div");
card.className = "token";

const chain = document.createElement("h3");
chain.textContent = "🌐 " + token.chainId.toUpperCase();

const address = document.createElement("p");
address.textContent = "Token address: " + token.tokenAddress;

const link = document.createElement("a");
link.href = token.url;
link.target = "_blank";
link.rel = "noopener noreferrer";
link.textContent = "View on DexScreener ↗";

const badge = document.createElement("p");
badge.className = "badge";
badge.textContent = "New token profile detected";

card.append(chain, badge, address, link);
container.appendChild(card);

});

status.textContent = "Scan completed successfully.";

} catch(error) {

status.textContent = "Unable to scan. Check your internet and try again.";

document.getElementById("scanner").textContent = "OFF";

} finally {

button.disabled = false;
button.textContent = "SCAN NEW TOKENS";

}

}

</script>

</body>
</html>
